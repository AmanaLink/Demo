name: Test and Auto-Merge

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-build:
    name: Test & Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint  # Run if lint script exists
      continue-on-error: true

    - name: Type check
      run: npm run typecheck  # Run if TypeScript
      continue-on-error: true

    - name: Run tests
      run: npm test  # Run if test script exists
      continue-on-error: true

    - name: Build
      run: npm run build
      continue-on-error: true

  auto-merge:
    name: Auto-Merge
    needs: [test-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Auto-merge PR
      run: |
        gh pr merge ${{ github.event.pull_request.number }} \
          --auto \
          --merge \
          --delete-branch
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  auto-merge-dependabot:
    name: Auto-Merge Dependabot
    needs: [test-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Auto-merge Dependabot PR
      run: |
        gh pr merge ${{ github.event.pull_request.number }} \
          --auto \
          --merge \
          --delete-branch
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}